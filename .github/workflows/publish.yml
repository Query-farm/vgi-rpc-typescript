name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Was pinned to 1.3.5 to dodge a dist that failed to load with
          # dangling re-export aliases (`export { RpcError2 as RpcError }`,
          # RpcError2 never declared). That was never a bun bug: the entry is a
          # pure re-export and `sideEffects: false` let ANY bun tree-shake it
          # down to an export list with no definitions. Entry modules are now
          # listed in package.json `sideEffects`, which fixes it at the source —
          # verified by building this package on 1.3.14. The "Verify dist
          # actually loads" step below is the backstop.
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify dist outputs exist
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          # The `browser` export condition resolves here; a missing emit would
          # ship a package that is unresolvable for every browser bundler.
          test -f dist/browser/index.workerd.js
          test -f dist/browser/arrow/impl-arrowjs/index.js

      - name: Verify dist actually loads
        # Guards against bundler re-export bugs that emit a syntactically valid
        # but unloadable module (dangling export aliases). Fails the publish
        # instead of shipping a broken tarball.
        run: |
          bun -e "try { await import('./dist/index.js'); console.log('dist/index.js loaded OK'); } catch (e) { console.error('dist/index.js failed to load:', e); process.exit(1); }"
          # Same guard for the entry the `browser` condition resolves to — it is
          # a pure re-export too, so it fails the same way if tree-shaken.
          bun -e "try { const m = await import('./dist/browser/index.workerd.js'); if (!Object.keys(m).length) throw new Error('no exports'); console.log('dist/browser/index.workerd.js loaded OK'); } catch (e) { console.error('dist/browser/index.workerd.js failed to load:', e); process.exit(1); }"

      - name: Publish to npm
        run: npm publish --access public --provenance
