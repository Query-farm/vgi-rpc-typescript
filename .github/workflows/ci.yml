name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install && bun run postinstall

      - name: Lint and format check
        run: bunx biome check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install && bun run postinstall

      - name: Run unit tests
        run: bun test test/wire.test.ts test/describe.test.ts test/schema.test.ts test/output-collector.test.ts test/batch-metadata.test.ts test/http/handler.test.ts test/http/landing.test.ts test/http/oauth-pkce.test.ts test/http/token.test.ts test/proof.test.ts

      # Batch metadata is encoded differently per backend, and the bug this
      # guards against was flechette-only: its encoder needs an explicit
      # `batchMetadata` option, so the map was dropped on serialize while
      # arrow-js carried it natively. Running the guard on arrow-js alone would
      # not have caught it.
      - name: Run batch-metadata guard (flechette backend)
        run: bun --conditions=flechette test test/batch-metadata.test.ts

      - name: Run client tests (bun transports only)
        run: timeout 120 bun test test/client.test.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install && bun run postinstall

      - name: Build
        run: bun run build

      - name: Verify dist outputs exist
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install root dependencies
        run: bun install && bun run postinstall

      - name: Install docs dependencies
        run: cd docs && npm install

      - name: Build documentation site (generates API reference)
        run: cd docs && npm run build

      - name: Check API documentation coverage
        run: node scripts/check-api-docs.mjs

  runtime-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install dependencies
        run: bun install && bun run postinstall

      - name: Build
        run: bun run build

      - name: Smoke test (Bun)
        run: timeout 60 bun run ./test/smoke-import.ts

      - name: Bundle smoke test for Node.js / Deno
        run: mkdir -p .smoke-bundle && bun build ./test/smoke-import.ts --outfile .smoke-bundle/smoke.js --target node --format esm

      - name: Smoke test (Node.js)
        run: timeout 60 node .smoke-bundle/smoke.js

      - name: Smoke test (Deno)
        run: timeout 60 deno run --allow-all .smoke-bundle/smoke.js

  landing-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install JS dependencies
        run: bun install && bun run postinstall

      - name: Install Python dependencies
        run: pip install jsonschema

      - name: Boot landing worker and run landing conformance
        run: |
          bun run examples/conformance-landing.ts > /tmp/landing-port.txt &
          WORKER_PID=$!
          for i in $(seq 1 30); do
            PORT=$(grep -o 'PORT:[0-9]*' /tmp/landing-port.txt | cut -d: -f2 || true)
            [ -n "$PORT" ] && break
            sleep 0.5
          done
          test -n "$PORT" || { echo "worker did not report a port"; cat /tmp/landing-port.txt; exit 1; }
          echo "worker on port $PORT"
          # The runner + describe.schema.json are vendored under conformance/;
          # DEFAULT_SCHEMA resolves next to the script.
          python conformance/run_landing_conformance.py --url "http://localhost:$PORT"
          STATUS=$?
          kill $WORKER_PID 2>/dev/null || true
          exit $STATUS

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install JS dependencies
        run: bun install && bun run postinstall

      - name: Install Python dependencies
        # Keep this floor at the release carrying the newest conformance group
        # this port implements. A floor that trails the suite resolves an older
        # vgi-rpc where the new group is *absent rather than skipped*, so CI
        # goes green having never run it. This run got 0.28.3 only by luck of
        # timing — the Rust port's identical floor resolved 0.28.2 eighty
        # seconds after 0.28.3 published, before PyPI's index reached pip.
        # 0.28.3: TestProxyProof capability-header cases.
        # 0.29.0: TestSticky failure-path fixtures (expiry, wrong worker,
        #   cross-principal replay) — required now, not skippable.
        run: pip install "vgi-rpc[http,cli,external]>=0.30.0" pytest

      - name: Run conformance tests
        run: timeout 120 python -m pytest test_ts_conformance.py -x -v

      - name: Run HTTP conformance tests
        run: timeout 120 bun test test/http/conformance.test.ts

      - name: Run client tests (all transports)
        env:
          VGI_RPC_PYTHON_BIN: python3
        run: timeout 120 bun test test/client.test.ts
