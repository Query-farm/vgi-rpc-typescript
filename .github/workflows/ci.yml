name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint and format check
        run: bunx biome check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test test/wire.test.ts test/describe.test.ts test/schema.test.ts test/output-collector.test.ts test/batch-metadata.test.ts test/large-payload.test.ts test/http/handler.test.ts test/http/landing.test.ts test/http/oauth-pkce.test.ts test/http/token.test.ts test/proof.test.ts

      # Batch metadata is encoded differently per backend, and the bug this
      # guards against was flechette-only: its encoder needs an explicit
      # `batchMetadata` option, so the map was dropped on serialize while
      # arrow-js carried it natively. Running the guard on arrow-js alone would
      # not have caught it.
      - name: Run batch-metadata guard (flechette backend)
        run: bun --conditions=flechette test test/batch-metadata.test.ts

      - name: Run client tests (bun transports only)
        run: timeout 180 bun test test/client.test.ts test/client-native-conformance.test.ts test/iroh-client.test.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify dist outputs exist
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install root dependencies
        run: bun install

      - name: Install docs dependencies
        run: cd docs && npm install

      - name: Build documentation site (generates API reference)
        run: cd docs && npm run build

      - name: Check API documentation coverage
        run: node scripts/check-api-docs.mjs

  runtime-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Smoke test (Bun)
        run: timeout 60 bun run ./test/smoke-import.ts

      - name: Bundle smoke test for Node.js / Deno
        run: mkdir -p .smoke-bundle && bun build ./test/smoke-import.ts --outfile .smoke-bundle/smoke.js --target node --format esm

      - name: Smoke test (Node.js)
        run: timeout 60 node .smoke-bundle/smoke.js

      - name: Smoke test (Deno)
        run: timeout 60 deno run --allow-all .smoke-bundle/smoke.js

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out vgi-rpc-python conformance suite
        uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi-rpc-python
          path: .vgi-rpc-python

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install JS dependencies
        run: bun install

      - name: Install Python dependencies
        # Test against the suite on Python main so coordinated protocol changes
        # are verifiable before either package is published. Installing the
        # latest PyPI release can pair a new worker protocol with an old client
        # and fail before conformance begins.
        #
        # The large_payload group is ungated and runs on every invocation
        # below. Note that
        #   the *transport* half of what it guards is invisible on this runner:
        #   Linux caps a single transfer at 0x7ffff000 and returns a short
        #   count that any correct loop absorbs, so the macOS pipe truncation
        #   and socket EINVAL only show up when the suite is run on a Mac. What
        #   this runner does catch is the Arrow encoder half, which is
        #   platform-independent.
        # The `conformance` extra is the only thing that supplies jsonschema,
        # which vgi_rpc.access_log_conformance imports at module level. That
        # module is pulled in by a deferred import inside _validate_access_log,
        # so omitting the extra fails *only* the access-log step below, with an
        # ImportError that looks nothing like the contract violation it exists
        # to catch.
        run: pip install ".vgi-rpc-python[http,cli,external,conformance]" pytest

      - name: Run conformance tests
        run: timeout 120 python -m pytest test_ts_conformance.py -x -v

      # The runner-driven suite with no access log attached. This is the only
      # place the `large_payload` group runs: test_ts_conformance.py drives
      # `_pytest_suite.py`, which carries no such tests, so the category is
      # reachable only through `vgi-rpc-test`. It became required in vgi-rpc
      # 0.42.0, and `echo_binary_over_int32_max` is the one test that reaches
      # the size where a single write(2)/send(2) stops accepting a whole
      # buffer. On this port it passes by refusing — see the ceiling note in
      # CLAUDE.md — and the refusal has to stay observable, which it is not
      # when the worker dies first.
      - name: Run conformance suite (large payloads included)
        run: timeout 600 vgi-rpc-test --cmd "bun run examples/conformance.ts"

      # Access-log conformance was verified by hand until now, and drifted
      # anyway — four separate manual inspections passed a contract that was
      # wrong. Validating the emitted records here is the only thing that keeps
      # the schema honest.
      #
      # --access-log-debug is load-bearing: at INFO the worker replaces
      # `request_data` with a `payload_omitted` marker, and the validator only
      # checks the field is well-formed *when present*, so an INFO log passes
      # every request_data rule without ever exercising one.
      # --require-request-data turns that silent pass into a failure.
      #
      # `large_payload` is excluded here, and only here. At
      # --access-log-debug every record embeds its whole request payload, so
      # the >2 GiB test would ask this step to write a multi-gigabyte JSONL
      # line and then schema-validate it in Python — which killed the worker
      # outright and failed every test after it with a broken pipe. The group
      # still runs, unfiltered, in the step above. What this step checks is
      # the log's *shape*, and an ordinary payload exercises that identically.
      #
      # Nothing else is filtered. Zero-parameter methods (`void_noop`) send an
      # empty schema and no row, and a validator that demands one row
      # unconditionally rejects them — that bug shipped in 0.36.1. Any
      # --filter added here must keep `void*` in scope.
      - name: Validate access log against the cross-language schema
        run: |
          rm -f /tmp/conformance-access.jsonl
          timeout 300 vgi-rpc-test \
            --cmd "bun run examples/conformance.ts --access-log /tmp/conformance-access.jsonl --access-log-debug" \
            --access-log /tmp/conformance-access.jsonl \
            --require-request-data \
            --filter '!large_payload'
          python conformance/check_access_log_streams.py /tmp/conformance-access.jsonl

      # The step above ran the *pipe* worker, where one dispatch covers a whole
      # stream. HTTP is where a stream is many requests, so it is the only
      # transport whose records have to chain — and it was never validated at
      # all until now. It went unvalidated while emitting 32 zeros as the
      # stream id of every stream on the server, and no `request_data` on
      # `/init`: on this very suite `--access-log` reported "PASS: 191 entries
      # validated" over 113 stream records, none of which named a stream.
      #
      # Hence the second checker. `--require-request-data` only inspects unary
      # records, and `stream_id` passes the schema's hex pattern whatever it
      # holds, so neither of the tools above can see either bug. A validator
      # that passes over records that never carried the value it validates is
      # not evidence, and this is the third time that shape has shipped.
      - name: Validate the HTTP access log, including stream records
        run: |
          rm -f /tmp/conformance-http-access.jsonl
          bun run examples/conformance-http.ts \
            --access-log /tmp/conformance-http-access.jsonl --access-log-debug > /tmp/http-access-port.txt &
          WORKER_PID=$!
          for i in $(seq 1 30); do
            PORT=$(grep -o 'PORT:[0-9]*' /tmp/http-access-port.txt | cut -d: -f2 || true)
            [ -n "$PORT" ] && break
            sleep 0.5
          done
          test -n "$PORT" || { echo "worker did not report a port"; cat /tmp/http-access-port.txt; exit 1; }
          STATUS=0
          # `|| STATUS=1` on both so a schema failure and a stream-coverage
          # failure are each reported, rather than the first aborting under
          # `bash -e` and hiding the second.
          # `large_payload` excluded for the same reason as the pipe step
          # above: at DEBUG the record embeds the payload, and the 4 MiB test
          # alone overshoots the emitter's per-record cap, so `request_data`
          # is shed (access-log-spec §5b) and --require-request-data reports
          # the record as missing it. The >2 GiB test never reaches HTTP —
          # it is scoped to pipe/unix/tcp — so this is purely about the 4 MiB
          # one. Both run in the dedicated suite step earlier.
          timeout 300 vgi-rpc-test \
            --url "http://127.0.0.1:$PORT" \
            --access-log /tmp/conformance-http-access.jsonl \
            --require-request-data \
            --filter '!large_payload' || STATUS=1
          python conformance/check_access_log_streams.py \
            /tmp/conformance-http-access.jsonl --http --require-continuations || STATUS=1
          kill $WORKER_PID 2>/dev/null || true
          exit $STATUS

      - name: Run HTTP conformance tests
        run: timeout 120 bun test test/http/conformance.test.ts

      - name: Run client tests (all transports)
        env:
          VGI_RPC_PYTHON_BIN: python3
        run: timeout 120 bun test test/client.test.ts test/client-native-conformance.test.ts

  # The other direction: this port's *client*, driven by the shared suite
  # through the JSONL driver in `conformance/client-driver.ts`.
  #
  # Its own job, because the thing it proves is different in kind. Every other
  # conformance leg points the reference client at this port's server. Nothing
  # pointed this port's client at a foreign server, and this port's server
  # accepts both bare and namespaced request paths — so a client that addressed
  # the wrong one would pass here and fail everywhere else. That is not
  # hypothetical: it is what the Rust port shipped for weeks, green at home and
  # 730 failures against the reference.
  client-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out vgi-rpc-python
        # The `serve_conformance_*.py` fixtures live in the repository, not in
        # the wheel, so a run against the reference *server* needs the
        # checkout as well as the installed package. Unpinned, deliberately:
        # a reference change that breaks this port should turn it red the day
        # it lands, not eleven days later.
        uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi-rpc-python
          path: .vgi-rpc-python

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install JS dependencies
        run: bun install

      - name: Install Python dependencies
        run: pip install ".vgi-rpc-python[http,cli,external,conformance]" pytest

      # `VGI_CLIENT_DRIVER` is split with shlex, so an interpreted driver needs
      # no wrapper script.
      - name: Drive this port's client against the PYTHON REFERENCE server
        # This is the gate. A green run against our own server proves the two
        # halves of one port agree with each other; it does not prove either
        # agrees with the protocol.
        env:
          VGI_CLIENT_DRIVER: bun run conformance/client-driver.ts
          VGI_CONFORMANCE_ROLE: client
          VGI_CONFORMANCE_SERVER: python
          VGI_RPC_PYTHON_REPO: ${{ github.workspace }}/.vgi-rpc-python
        run: timeout 900 python -m pytest test_ts_conformance.py -q

      - name: Drive this port's client against this port's own server
        # Not a conformance claim — a regression check. When the two legs
        # disagree the gap localises the defect to one side in one run.
        env:
          VGI_CLIENT_DRIVER: bun run conformance/client-driver.ts
          VGI_CONFORMANCE_ROLE: client
          VGI_CONFORMANCE_SERVER: typescript
        run: timeout 900 python -m pytest test_ts_conformance.py -q

  # Two tools in the Python reference compare *ports to each other*, which is
  # the one thing no single repository's own suite can do. Until they ran here
  # they ran on a maintainer's laptop, so the cross-implementation checks were
  # the ones nothing enforced: four ports described `vgi_rpc.Reflection.v1` as
  # having zero methods, six logged six different wrong `protocol_hash` values,
  # and a client sent bare paths that only a stricter server rejected. This
  # port is where the last of those hid longest — its server accepted both bare
  # and namespaced paths, so a non-conformant peer stayed invisible for weeks.
  # Agreement with the reference is exactly what that could not show.
  #
  # Kept as its own job rather than appended to `conformance`: this is seconds
  # of work behind that job's ~20 minutes of timeouts, it wants to report red
  # under its own name rather than as the tail of a long log, and the setup it
  # duplicates is five lines of boilerplate.
  cross-port-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install JS dependencies
        # `examples/conformance.ts` imports `../src/index.js` directly, so the
        # worker `describe_diff` spawns needs no build step — matching its
        # SUBPROCESS_WORKERS entry, which gives this port a `cmd` and no
        # `build`.
        run: bun install

      - name: Arrange the reference as a sibling checkout
        run: |
          REPOS="$(dirname "$GITHUB_WORKSPACE")"
          # Both tools resolve a port as $VGI_RPC_REPOS/vgi-rpc-<name>, so this
          # checkout has to already sit at that path. On GitHub's runners the
          # workspace is .../work/<repo>/<repo>, so it does — but assert it
          # here instead of assuming, because the failure it prevents is a
          # layout mistake and both tools would otherwise report it as
          # something else: describe_diff as a worker that would not spawn,
          # identity_consistency as a repository that does not exist.
          test -f "$REPOS/vgi-rpc-typescript/package.json" \
            || { echo "expected this checkout at $REPOS/vgi-rpc-typescript"; ls -la "$REPOS"; exit 1; }
          # main, deliberately unpinned. A pinned ref is how the Java port's
          # Iroh lane reported green for eleven days against a reference that
          # had moved. A reference change that breaks this port should turn
          # this port red the day it lands.
          git clone --depth 1 https://github.com/Query-farm/vgi-rpc-python "$REPOS/vgi-rpc-python"
          echo "VGI_RPC_REPOS=$REPOS" >> "$GITHUB_ENV"

      - name: Install the reference
        # Same extras as the `conformance` job above: the tools import
        # vgi_rpc.conformance and the reflection internals, and drive the
        # in-process Python worker that serves as the comparison baseline.
        run: pip install -e "$VGI_RPC_REPOS/vgi-rpc-python[http,cli,external,conformance]"

      - name: Compare every hosted protocol against the reference
        # Spawns this port's conformance worker, asks it over
        # vgi_rpc.Reflection.v1 what it hosts, describes each protocol, and
        # compares `protocol_hash` against Python's. Exits non-zero on drift,
        # and also on an unreachable worker — fewer than two reachable ports is
        # a failure, not a skip.
        run: |
          cd "$VGI_RPC_REPOS/vgi-rpc-python"
          timeout 300 python tools/cross-port/describe_diff.py --only typescript

      - name: Audit vgi_rpc.Identity.v1 against the reference
        # A source-level grep, because Identity's security properties — guard
        # order, window sizes, transient-vs-definitive — live in code the
        # protocol hash does not cover.
        #
        # --verbose for the file list: the tool exits non-zero when a port's
        # repository is missing (vgi-rpc-python 1eedad2 — before that it
        # reported a clean run about a column it never filled in), but a
        # passing exit code and an audit that read something are still
        # different claims. The assertion below is on the latter: this port
        # named, with a file count above zero. A regex over zero files matches
        # nothing and agrees with everything.
        run: |
          cd "$VGI_RPC_REPOS/vgi-rpc-python"
          set -o pipefail
          timeout 120 python tools/cross-port/identity_consistency.py --only typescript --verbose \
            | tee "$RUNNER_TEMP/identity.txt"
          grep -qE '^=== typescript: [1-9][0-9]* identity file\(s\)' "$RUNNER_TEMP/identity.txt" \
            || { echo "identity_consistency audited no TypeScript sources"; exit 1; }
